<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Nexus</title>
    <!-- Configuração para o site virar um App na tela inicial -->
    <link rel="manifest" href='data:application/json,{"name":"Voxel Nexus","short_name":"Voxel","start_url":"/","display":"standalone","background_color":"%23000000"}'>
    <style>
        body, html { margin: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; }
        #top-bar { height: 60px; background: #111; display: flex; align-items: center; padding: 0 10px; border-bottom: 2px solid #00ff00; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #333; background: #000; color: #fff; margin-right: 10px; }
        button { padding: 8px 15px; background: #00ff00; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; color: #000; }
        #nita-btn { background: #00ff00; margin-left: 5px; }
        #create-btn { background: #333; color: #00ff00; margin-left: 5px; }
        #viewport { width: 100%; height: calc(100% - 60px); border: none; }
        #nita-panel { display: none; position: absolute; top: 60px; right: 0; width: 320px; height: 70%; background: #111; border-left: 2px solid #00ff00; }
    </style>
</head>
<body>
    <div id="top-bar">
        <input type="text" id="url" placeholder="Pesquisar ou digitar URL...">
        <button onclick="document.getElementById('viewport').src=document.getElementById('url').value">Ir</button>
        <button id="nita-btn" onclick="toggleNita()">IA</button>
        <button id="create-btn" onclick="alert('Para criar seu site: Clique em Fork neste repositório no GitHub e edite seu index.html!')">Crie o seu</button>
    </div>
    
    <!-- O iframe carrega os sites que você pesquisar -->
    <iframe id="viewport" src="https://www.google.com"></iframe>

    <!-- Painel da Nita -->
    <div id="nita-panel">
        <iframe src="https://SUA-NITA-AQUI.github.io" width="100%" height="100%"></iframe>
    </div>

    <script>
        function toggleNita() {
            let panel = document.getElementById('nita-panel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }
    </script>
</body>
</html>
